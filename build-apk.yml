name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Live website URL the app should open (https://...)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "android-wrapper/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      # Priority: manual input -> repo variable APP_URL
      APP_URL: ${{ inputs.app_url || vars.APP_URL }}
    defaults:
      run:
        working-directory: android-wrapper
    steps:
      - uses: actions/checkout@v4

      - name: Check live URL is set
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Set repo variable APP_URL (Settings > Secrets and variables > Actions > Variables) or pass app_url when running manually."
            exit 1
          fi
          case "$APP_URL" in https://*) ;; *) echo "::error::APP_URL must start with https://"; exit 1;; esac
          echo "Using $APP_URL"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Set website URL in Capacitor config
        run: |
          node -e '
            const fs=require("fs");
            const c=JSON.parse(fs.readFileSync("capacitor.config.json","utf8"));
            c.server.url=process.env.APP_URL;
            fs.writeFileSync("capacitor.config.json",JSON.stringify(c,null,2));
          '

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon from cover.png
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          SRC=../app/public/presets/cover.png
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            dir=android/app/src/main/res/mipmap-$d
            mkdir -p $dir
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert "$SRC" -background "#090a0d" -gravity center -resize ${s}x${s} -extent ${s}x${s} $dir/$n.png
            done
          done
          # remove adaptive icon xml so the PNGs above are used
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SSG-Sewing.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SSG-Sewing-apk
          path: android-wrapper/SSG-Sewing.apk
          if-no-files-found: error
