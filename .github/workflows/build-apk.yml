name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Live website URL (optional, overrides default)"
        required: false
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ inputs.app_url || 'https://YOUR-SITE-URL' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check URL
        run: |
          case "$APP_URL" in
            https://YOUR-SITE-URL*) echo "::error::Edit APP_URL in the workflow file or pass app_url"; exit 1;;
            https://*) ;;
            *) echo "::error::APP_URL must start with https://"; exit 1;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Create Capacitor wrapper
        run: |
          mkdir -p android-wrapper/www
          cd android-wrapper
          cat > package.json <<'EOF'
          {
            "name": "ssg-sewing-android",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/cli": "^7.0.0",
              "@capacitor/core": "^7.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.ssg.sewing",
            "appName": "SSG Sewing",
            "webDir": "www",
            "server": { "url": "$APP_URL", "cleartext": false }
          }
          EOF
          cat > www/index.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSG Sewing</title><style>body{margin:0;height:100vh;display:grid;place-items:center;background:#090a0d;color:#fff;font-family:sans-serif;text-align:center}</style></head><body><div><h2>SSG Sewing</h2><p>Loading... check your internet connection.</p></div></body></html>
          EOF

      - name: Install and add Android
        working-directory: android-wrapper
        run: |
          npm install
          npx cap add android

      - name: Generate app icon
        working-directory: android-wrapper
        run: |
          SRC=../app/public/presets/cover.png
          if [ -f "$SRC" ]; then
            sudo apt-get install -y imagemagick >/dev/null
            for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              d=${pair%%:*}; s=${pair##*:}
              dir=android/app/src/main/res/mipmap-$d
              mkdir -p $dir
              for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
                convert "$SRC" -background "#090a0d" -gravity center -resize ${s}x${s} -extent ${s}x${s} $dir/$n.png
              done
            done
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi

      - name: Build debug APK
        working-directory: android-wrapper
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SSG-Sewing.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SSG-Sewing-apk
          path: android-wrapper/SSG-Sewing.apk
          if-no-files-found: error
